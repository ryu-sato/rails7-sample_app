name: Close Dependabot PRs

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for closing PRs'
        required: true
        default: 'disable auto upgrade'

jobs:
  close-dependabot-prs:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Close Dependabot PRs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            
            const dependabotPRs = pulls.filter(pr => 
              pr.user.login === 'dependabot[bot]' && 
              pr.labels.some(label => label.name === 'dependencies')
            );
            
            console.log(`Found ${dependabotPRs.length} Dependabot PRs to close`);
            
            for (const pr of dependabotPRs) {
              console.log(`Closing PR #${pr.number}: ${pr.title}`);
              
              // Add comment with reason
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `${{ github.event.inputs.reason }}`
              });
              
              // Close the PR
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed'
              });
            }
            
            console.log('All Dependabot PRs have been closed');